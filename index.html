<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto - Página Inicial</title>
    <!-- Ligação com o arquivo CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <h1 class="logo">Meu Projeto</h1>
        <nav class="menu">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main class="conteudo">
        <section id="home" class="secao">
            <h2>Bem-vindo!</h2>
            <p>Este é um exemplo de página com HTML e CSS separados.</p>
            <button class="botao">Saiba mais</button>
        </section>

        <section id="sobre" class="secao">
            <h2>Sobre</h2>
            <p>Projeto criado para praticar a organização de código.</p>
        </section>

        <section id="contato" class="secao">
            <h2>Contato</h2>
            <form class="formulario">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com">

                <button type="submit" class="botao">Enviar</button>
            </form>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="rodape">
        <p>&copy; 2026 Meu Projeto. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
